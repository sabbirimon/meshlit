[versions]
# Build tooling
agp = "9.2.1"
# Kotlin bumped 2.1.0 → 2.4.10 so the RunAnywhere SDK 0.20.12
# (compiled with Kotlin 2.4.0 metadata) can be linked. AGP 9.2.1
# supports Kotlin 2.4.x via the bundled compose-compiler plugin.
kotlin = "2.4.10"

# AndroidX core
coreKtx = "1.19.0"
appcompat = "1.6.1"
activityCompose = "1.10.0"
lifecycle = "2.9.0"
material = "1.10.0"
datastore = "1.1.1"

# HTTP
okhttp = "4.12.0"
nanohttpd = "2.3.1"
zxing = "3.5.3"

# Security — Android Keystore-backed EncryptedSharedPreferences
# for cloud-provider tokens. Pulled in by core-trust +
# core-cloud-mcp only; ~250 KB.
securityCrypto = "1.1.0-alpha06"

# Local RAG store — Room + sqlite-vss for vector similarity search
# on-device. Both versions track the Kotlin 2.4.x line and the
# Room 2.7.x release line that supports it.
room = "2.7.0-alpha11"
sqliteVss = "0.1.4"

# Desugaring
desugar = "2.1.4"

# Compose
composeBom = "2025.05.00"
navigationCompose = "2.9.0"

# Serialization
kotlinxSerialization = "1.8.0"
kotlinxCoroutines = "1.10.0"

# Logging
slf4j = "2.0.16"
logback = "1.5.18"

# Phase 2.x — multi-runtime inference backends
onnxruntime = "1.18.0"

# RunAnywhere SDK — Kotlin/Android bindings for the on-device LLM
# runtime published under io.github.sanchitmonga22. The 0.20.x line
# requires Kotlin 2.4.x (the SDK is compiled with that metadata
# version). The project pinned this to 2.4.10 alongside the SDK
# upgrade so the .class files in the AAR are readable.
runanywhere = "0.20.12"

# Tests
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
robolectric = "4.13"

# UI Automator — Google's official cross-app automation library.
# Pulled in as a `main` implementation because
# MeshlitAccessibilityService binds against UiDevice / By /
# UiObject2 at runtime (see AndroidUiAutomatorBridge.kt), not
# just during tests. 2.3.0 is the latest stable on the
# AGP 8.x baseline. UI Automator is API 21+ so it covers the
# project's minSdk floor.
uiAutomator = "2.3.0"

# Vendored RunAnywhere SDK — Square Wire runtime (protobuf codec
# used by the SDK's generated proto classes). 5.5.1 matches the
# upstream SDK's wire-compiler output version.
wire = "5.5.1"
androidxAnnotation = "1.8.2"

[libraries]
# Gradle plugin marker artifacts (used only by build-logic)
android-gradle-plugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradle-plugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }

# AndroidX core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-annotation-jvm = { group = "androidx.annotation", name = "annotation", version.ref = "androidxAnnotation" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-savedstate = { group = "androidx.savedstate", name = "savedstate-ktx", version = "1.2.1" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# HTTP clients
okhttp-core = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
nanohttpd-core = { group = "org.nanohttpd", name = "nanohttpd", version.ref = "nanohttpd" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }

# Security — Android Keystore-backed EncryptedSharedPreferences
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# Room + sqlite-vss (local RAG vector store)
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
sqlite-vss = { group = "io.github.z-huang", name = "sqlite-vss", version.ref = "sqliteVss" }

# Vendored RunAnywhere SDK runtime support.
wire-runtime = { group = "com.squareup.wire", name = "wire-runtime", version.ref = "wire" }

# Phase 2.x — ONNX Runtime Mobile (the second shipped engine)
onnxruntime-mobile = { group = "com.microsoft.onnxruntime", name = "onnxruntime-mobile", version.ref = "onnxruntime" }

# RunAnywhere SDK — on-device LLM runtime.
# Core artifact: required. Includes the public RunAnywhere entry
# point (init, generate, generateStream, downloadModelStream,
# loadModel) and the cross-runtime plumbing.
runanywhere-sdk = { group = "io.github.sanchitmonga22", name = "runanywhere-sdk", version.ref = "runanywhere" }

# RunAnywhere llama.cpp backend. ~34 MB native code; bundles
# libllama.so per ABI. Pulls in runanywhere-sdk transitively, but
# we still declare both so version conflicts surface at sync time.
runanywhere-llamacpp = { group = "io.github.sanchitmonga22", name = "runanywhere-llamacpp", version.ref = "runanywhere" }

# RunAnywhere ONNX backend. Required for STT/TTS/VAD on the
# Voice screen. ~25 MB across 4 ABIs. Pulls in sherpa-onnx
# transitively for the inference runtime. Pulled in uncommented
# because the Voice screen now requires it.
runanywhere-onnx = { group = "io.github.sanchitmonga22", name = "runanywhere-onnx", version.ref = "runanywhere" }

# Desugaring JDK libs
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugar" }

# Compose
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Serialization
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

# Logging
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
logback-android = { group = "com.github.tony19", name = "logback-android", version.ref = "logback" }

# Tests
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

# UI Automator — Google's official Android UI Automator library.
# Used at runtime by MeshlitAccessibilityService (in
# AndroidUiAutomatorBridge.kt) to find / click / type into
# nodes across apps. Same library the Espresso / Compose-test
# UI Automator framework uses.
androidx-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiAutomator" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }