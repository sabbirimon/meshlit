name: Multiplatform client preview
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, dev, plan/studio-mobile-lts]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'scripts/release-asset-relay.py'
      - '.github/workflows/prerelease-relay.yml'
permissions:
  contents: read
jobs:
  clients:
    permissions:
      contents: read
      id-token: write
      attestations: write
    name: Host client contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test Studio dashboard, settings, project windows and chat
        run: node --test companions/studio-runtime/extension/chat-setup.test.cjs companions/studio-runtime/extension/navigation.test.cjs companions/studio-runtime/extension/management.test.cjs companions/studio-runtime/extension/settings.test.cjs companions/studio-runtime/extension/shell.test.cjs companions/studio-runtime/extension/main-pages.test.cjs
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: KMP contracts, actual TCP failures and native offscreen UI
        shell: bash
        run: ./gradlew :shared-workspace:jvmTest :desktop-engine:test :desktop-ssh:test :desktopApp:test --no-daemon --max-workers=2
      - name: NEXT static project boundaries (not a HAP build)
        shell: bash
        run: python3 scripts/check-next-preview.py
      - name: Build experimental Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: ./gradlew :desktopApp:packageMsi --no-daemon --max-workers=2
      - name: Build experimental Linux installer
        if: runner.os == 'Linux'
        shell: bash
        run: ./gradlew :desktopApp:packageDeb --no-daemon --max-workers=2
      - name: Build experimental macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: ./gradlew :desktopApp:packageDmg --no-daemon --max-workers=2
      - name: Launch the packaged client and render its workspace
        shell: python
        run: |
          import os, pathlib, subprocess, tempfile
          root = pathlib.Path('desktopApp/build/compose/binaries/main')
          platform = os.environ['RUNNER_OS']
          with tempfile.TemporaryDirectory() as temp:
              stage = pathlib.Path(temp) / 'stage'
              stage.mkdir()
              if platform == 'Windows':
                  [msi] = root.glob('**/*.msi')
                  subprocess.run(['msiexec.exe', '/a', str(msi.resolve()), '/qn', 'TARGETDIR=' + str(stage)], check=True, timeout=120)
                  [launcher] = [p for p in stage.rglob('*.exe') if p.name.lower() == 'meshlit.exe']
              elif platform == 'Linux':
                  [deb] = root.glob('**/*.deb')
                  subprocess.run(['dpkg-deb', '-x', str(deb), str(stage)], check=True)
                  [launcher] = [p for p in stage.rglob('*') if p.name.lower() == 'meshlit' and p.parent.name == 'bin' and p.is_file()]
              else:
                  [dmg] = root.glob('**/*.dmg')
                  subprocess.run(['hdiutil', 'attach', '-readonly', '-nobrowse', '-mountpoint', str(stage), str(dmg)], check=True)
                  [launcher] = stage.glob('*.app/Contents/MacOS/Meshlit')
              try:
                  image = pathlib.Path(temp) / 'workspace.png'
                  command = [str(launcher.resolve()), '--render-check', str(image)]
                  if platform == 'Linux':
                      command = ['xvfb-run', '-a'] + command
                  subprocess.run(command, check=True, timeout=90)
                  assert image.read_bytes()[:8] == b'\x89PNG\r\n\x1a\n', 'Packaged client did not render'
              finally:
                  if platform == 'macOS':
                      subprocess.run(['hdiutil', 'detach', str(stage)], check=True)
      - id: stage
        name: Installer checksums and scope
        shell: python
        run: |
          import hashlib, json, pathlib, shutil, os
          root = pathlib.Path('desktopApp/build/compose/binaries/main')
          files = sorted(root.glob('**/*.msi')) + sorted(root.glob('**/*.deb')) + sorted(root.glob('**/*.dmg'))
          assert len(files) == 1, 'Missing installer'
          output = pathlib.Path('preview-assets')
          output.mkdir()
          for item in files:
              shutil.copy2(item, output / item.name)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as metadata:
              print('installer=' + str((output / files[0].name).as_posix()), file=metadata)
          for name in ['LICENSE', 'NOTICE']:
              shutil.copy2(name, output / name)
          shutil.copy2('docs/desktop/CROSS_PLATFORM_PRERELEASE.md', output / 'INSTALL.md')
          (output / 'BUILD.json').write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'], 'os': os.environ['RUNNER_OS'],
              'architecture': os.environ['RUNNER_ARCH'], 'publisherSigned': False,
              'bundledLocalInference': False, 'installedAppQualification': False
          }, indent=2) + '\n')
          checksums = []
          for item in sorted(output.iterdir()):
              checksums.append(hashlib.sha256(item.read_bytes()).hexdigest() + '  ' + item.name)
          (output / 'SHA256SUMS.txt').write_text('\n'.join(checksums) + '\n')
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "${{ steps.stage.outputs.installer }}"
      - name: Verify published provenance against this build
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          INSTALLER: ${{ steps.stage.outputs.installer }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "$INSTALLER" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/multiplatform-preview.yml" --source-digest "$GITHUB_SHA"
      - name: Retain experimental installers for release review
        uses: actions/upload-artifact@v4
        with:
          name: studio-preview-${{ runner.os }}-${{ runner.arch }}
          path: preview-assets/
          if-no-files-found: error
          retention-days: 14
