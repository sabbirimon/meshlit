name: Multiplatform client preview
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, dev, plan/studio-mobile-lts]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'scripts/release-asset-relay.py'
      - '.github/workflows/prerelease-relay.yml'
permissions:
  contents: read
jobs:
  clients:
    name: Host client contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: KMP contracts, actual TCP failures and native offscreen UI
        shell: bash
        run: ./gradlew :shared-workspace:jvmTest :desktop-engine:test :desktop-ssh:test :desktopApp:test --no-daemon --max-workers=2
      - name: NEXT static project boundaries (not a HAP build)
        shell: bash
        run: python3 scripts/check-next-preview.py
      - name: Build experimental Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: ./gradlew :desktopApp:packageMsi --no-daemon --max-workers=2
      - name: Build experimental Linux installer
        if: runner.os == 'Linux'
        shell: bash
        run: ./gradlew :desktopApp:packageDeb --no-daemon --max-workers=2
      - name: Installer checksums and scope
        if: runner.os != 'macOS'
        shell: python
        run: |
          import hashlib, json, pathlib, shutil, os
          root = pathlib.Path('desktopApp/build/compose/binaries/main')
          files = sorted(root.glob('**/*.msi')) + sorted(root.glob('**/*.deb'))
          assert files, 'Missing installer'
          output = pathlib.Path('preview-assets')
          output.mkdir()
          for item in files:
              shutil.copy2(item, output / item.name)
          for name in ['LICENSE', 'NOTICE']:
              shutil.copy2(name, output / name)
          shutil.copy2('docs/desktop/CROSS_PLATFORM_PRERELEASE.md', output / 'INSTALL.md')
          (output / 'BUILD.json').write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'], 'os': os.environ['RUNNER_OS'],
              'architecture': os.environ['RUNNER_ARCH'], 'publisherSigned': False,
              'bundledLocalInference': False, 'installedAppQualification': False
          }, indent=2) + '\n')
          checksums = []
          for item in sorted(output.iterdir()):
              checksums.append(hashlib.sha256(item.read_bytes()).hexdigest() + '  ' + item.name)
          (output / 'SHA256SUMS.txt').write_text('\n'.join(checksums) + '\n')
      - name: Retain experimental installers for release review
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: studio-preview-${{ runner.os }}-${{ runner.arch }}
          path: preview-assets/
          if-no-files-found: error
          retention-days: 14
