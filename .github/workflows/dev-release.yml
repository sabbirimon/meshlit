# Owner-triggered experimental APK release; Play submission is a separate gate.
name: Dev Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing or new beta tag (must start with dev-v)
        type: string
        required: true
  push:
    tags: ['dev-v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Android platform
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^dev-v[0-9][A-Za-z0-9._-]*$ ]] || exit 1
      - name: Prepare real starter model
        run: python3 scripts/prepare-bundled-model.py
      - name: Build and check beta APKs
        run: ./gradlew :app:assembleMeshlitV2Debug :app:testMeshlitV2DebugUnitTest :app:lintMeshlitV2Debug --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/meshlitV2/debug/app-meshlitV2-arm64-v8a-debug.apk release-assets/Meshlit-v2-beta-arm64-v8a.apk
          cp app/build/outputs/apk/meshlitV2/debug/app-meshlitV2-x86_64-debug.apk release-assets/Meshlit-v2-beta-x86_64.apk
          cd release-assets
          sha256sum *.apk > SHA256SUMS.txt
      - name: Publish experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --prerelease --title "Meshlit beta $RELEASE_TAG" --notes 'Debug-signed experimental V2 APKs. Optional native companions are included only if built separately. See README and docs/PLAY_DISTRIBUTION.md for capabilities and unresolved release gates.' release-assets/*.apk release-assets/SHA256SUMS.txt
