name: Publish verified Studio archives
on:
  push:
    branches: [release/studio-downloads]
    paths: ['.github/workflows/publish-studio.yml']
permissions:
  actions: read
  attestations: read
  contents: write
concurrency:
  group: publish-studio-downloads
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SOURCE: b5628bfbedac456ed4251429bf946df84020ebab
      RELEASE_SOURCE: 08a02f2757b00d28f8b7ef7a3c1486c647bc1f5b
      RUN: '45345849303'
      RELEASE_ID: '456418864'
      TAG: v2.0.49-studio.2
      APK: 'Meshlit-Android-arm64-debug.apk'
      APK_SHA: '9cb9e3bea4faecd5b386efca5d1e7fbcf6dfb3d9155f02f23928865481cbac6f'
      VSIX: 'Meshlit-Studio.vsix'
      VSIX_SHA: '61ded321053d35a51a114d41f6d99d5ced8f5eeb04d9bba601f8f68ae4a0fc46'
    steps:
      - name: Check release target and the completed cross-platform build
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/releases/$RELEASE_ID" > release.json
          jq -e --arg tag "$TAG" --arg source "$RELEASE_SOURCE" \
            '.draft and .prerelease and .tag_name == $tag and .target_commitish == $source' release.json
          test "$(gh run view "$RUN" -R "$REPO" --json conclusion,headSha --jq '[.conclusion,.headSha]|join(" ")')" = "success $SOURCE"
          mkdir incoming
          for name in "$APK" "$VSIX"; do
            gh release download "$TAG" -R "$REPO" --pattern "$name" --dir incoming
          done
          printf '%s  %s\n' "$APK_SHA" "$APK" "$VSIX_SHA" "$VSIX" > SHA256SUMS.txt
          (cd incoming && sha256sum --check ../SHA256SUMS.txt)

      - name: Verify desktop attestations and upload packages to the draft
        shell: bash
        run: |
          set -euo pipefail
          for platform in Windows-X64 Linux-X64 macOS-ARM64 macOS-X64; do
            name="Meshlit-Studio-$platform.tar.gz"
            artifact="Meshlit-Full-Studio-$platform"
            if [[ "$platform" == Windows-X64 ]]; then
              name="Meshlit-Studio-Windows-X64-Setup.exe"
              artifact="Meshlit-Studio-Windows-X64-Installer"
            fi
            gh run download "$RUN" -R "$REPO" -n "$artifact" -D "$platform"
            if [[ "$platform" != Windows-X64 ]]; then (cd "$platform" && sha256sum --check SHA256SUMS.txt); fi
            gh attestation verify "$platform/$name" --repo "$REPO" \
              --signer-workflow "$REPO/.github/workflows/full-studio.yml" --source-digest "$SOURCE"
            sum=$(sha256sum "$platform/$name" | cut -d' ' -f1)
            printf '%s  %s\n' "$sum" "$name" >> SHA256SUMS.txt
            gh api "repos/$REPO/releases/$RELEASE_ID" > release.json
            jq -e --arg tag "$TAG" '.draft and .tag_name == $tag' release.json
            existing=$(jq -r --arg asset "$name" '.assets[] | select(.name == $asset) | .digest' release.json)
            if [[ -n "$existing" ]]; then
              test "$existing" = "sha256:$sum"
            else
              gh release upload "$TAG" -R "$REPO" "$platform/$name"
            fi
            rm -r "$platform"
          done

      - name: Confirm every release asset digest and publish
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -l < SHA256SUMS.txt)" -eq 6
          LC_ALL=C sort -k2,2 -o SHA256SUMS.txt SHA256SUMS.txt
          gh api "repos/$REPO/releases/$RELEASE_ID" > release.json
          checksum=$(sha256sum SHA256SUMS.txt | cut -d' ' -f1)
          existing=$(jq -r '.assets[] | select(.name == "SHA256SUMS.txt") | .digest' release.json)
          if [[ -n "$existing" ]]; then
            test "$existing" = "sha256:$checksum"
          else
            gh release upload "$TAG" -R "$REPO" SHA256SUMS.txt
          fi
          gh api "repos/$REPO/releases/$RELEASE_ID" > release.json
          jq -e --arg tag "$TAG" --arg source "$RELEASE_SOURCE" \
            '.draft and .prerelease and .tag_name == $tag and .target_commitish == $source and (.assets|length) == 7' release.json
          while read -r digest name; do
            jq -e --arg asset "$name" --arg hash "sha256:$digest" \
              'any(.assets[]; .name == $asset and .digest == $hash and .state == "uploaded")' release.json
          done < <(cat SHA256SUMS.txt; printf '%s  SHA256SUMS.txt\n' "$checksum")
          gh release edit "$TAG" -R "$REPO" --draft=false --prerelease --latest=false
