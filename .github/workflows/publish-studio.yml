name: Publish verified Studio archives
on:
  push:
    branches: [release/studio-downloads]
    paths: ['.github/workflows/publish-studio.yml']
permissions:
  actions: read
  attestations: read
  contents: write
concurrency:
  group: publish-studio-downloads
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SOURCE: 28d75c1a8bbe2832efda7b87c6dd32ae3909eab9
      RUN: '45296747955'
      TAG: v2.0.49-studio.1
    steps:
      - name: Verify all tested packages before publishing
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..160}; do
            if [[ "$(gh run view "$RUN" -R "$REPO" --json status --jq .status)" == completed ]]; then break; fi
            sleep 20
          done
          test "$(gh run view "$RUN" -R "$REPO" --json conclusion,headSha --jq '[.conclusion,.headSha]|join(" ")')" = "success $SOURCE"
          mkdir assets
          for platform in Windows-X64 Linux-X64 macOS-ARM64 macOS-X64; do
            gh run download "$RUN" -R "$REPO" -D "$platform" -n "Meshlit-Full-Studio-$platform"
            filename="Meshlit-Studio-$platform.tar.gz"
            if [[ "$platform" == Windows-X64 ]]; then filename="Meshlit-Studio-$platform.zip"; fi
            archive="$platform/$filename"
            (cd "$platform" && sha256sum -c SHA256SUMS.txt)
            gh attestation verify "$archive" --repo "$REPO" --signer-workflow "$REPO/.github/workflows/full-studio.yml" --source-digest "$SOURCE"
            if [[ "$platform" == Windows-X64 ]]; then
              setup="$platform/Meshlit-Studio-Windows-X64-Setup.exe"
              gh attestation verify "$setup" --repo "$REPO" --signer-workflow "$REPO/.github/workflows/full-studio.yml" --source-digest "$SOURCE"
              mv "$setup" assets/
            fi
            mv "$archive" "assets/$filename"
            rm -r "$platform"
          done
          (cd assets && sha256sum * > SHA256SUMS.txt)
          cat > notes.md <<'NOTES'
          Download Windows Setup for a per-user installation, or extract the complete portable archive for your platform.

          This Studio preview adds nearby device discovery, device-ID pairing, per-device GGUF sharing and streamed remote replies. Internet pairing requires a configured HTTPS relay and an access token. The Mac and HP ran the installed IDE checks and the bundled offline model. A Samsung LTE protocol client paired through a private relay and received real model output. The Android 2.0.48 application is a separate download on the v2.0.48-studio.1 release.

          Desktop MeshCoin is an opt-in, non-transferable contribution preview. Each unit has a deterministic 128-character serial. The contributor can self-record for free or agree a percentage with a paired recordkeeper. Signed wallet backups preserve those records. The Hugging Face dashboard supports optional read-token sign-in and paginated public browsing. The LM Studio source uses its official SDK when permitted and falls back to the public model catalog.

          The sidebar can collapse to an icon rail. Meshlit Home has its own menus, local reply preferences, per-reply voting and contextual help for unavailable controls. The two-pane model picker opens from the composer without login and exposes public Hugging Face downloads and in-place LM Studio or Bionic GGUF registration. General Chat distinguishes speakers, identifies the model on replies and groups attachment, access, model, microphone and send/stop controls in the composer. General Chat, the IDE sidebar and welcome screen, and the desktop launchers use the ringed branch symbol. The archives were exercised after extraction. The Windows installer was installed, launched and uninstalled in CI. SHA256SUMS.txt covers all five downloads. GitHub attestations bind them to commit 28d75c1a8bbe2832efda7b87c6dd32ae3909eab9. The macOS preview uses ad-hoc signing. Windows publisher signing and Apple notarization are pending.
          NOTES
          gh release create "$TAG" -R "$REPO" --target "$SOURCE" --prerelease --draft --title "Meshlit Studio v2.0.49-studio.1" --notes-file notes.md assets/*
          gh release edit "$TAG" -R "$REPO" --draft=false
