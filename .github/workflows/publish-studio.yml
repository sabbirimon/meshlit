name: Publish verified Studio archives
on:
  push:
    branches: [release/studio-downloads]
    paths: ['.github/workflows/publish-studio.yml']
permissions:
  actions: read
  attestations: read
  contents: write
concurrency:
  group: publish-studio-downloads
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SOURCE: 64abba149841e63af3da3e615156c2cd94b09e4f
      RUN: '45265983766'
      TAG: v2.0.48-studio.4
    steps:
      - name: Verify all tested packages before publishing
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..160}; do
            if [[ "$(gh run view "$RUN" -R "$REPO" --json status --jq .status)" == completed ]]; then break; fi
            sleep 20
          done
          test "$(gh run view "$RUN" -R "$REPO" --json conclusion,headSha --jq '[.conclusion,.headSha]|join(" ")')" = "success $SOURCE"
          mkdir assets
          for platform in Windows-X64 Linux-X64 macOS-ARM64 macOS-X64; do
            gh run download "$RUN" -R "$REPO" -D "$platform" -n "Meshlit-Full-Studio-$platform"
            filename="Meshlit-Studio-$platform.tar.gz"
            if [[ "$platform" == Windows-X64 ]]; then filename="Meshlit-Studio-$platform.zip"; fi
            archive="$platform/$filename"
            (cd "$platform" && sha256sum -c SHA256SUMS.txt)
            gh attestation verify "$archive" --repo "$REPO" --signer-workflow "$REPO/.github/workflows/full-studio.yml" --source-digest "$SOURCE"
            if [[ "$platform" == Windows-X64 ]]; then
              setup="$platform/Meshlit-Studio-Windows-X64-Setup.exe"
              gh attestation verify "$setup" --repo "$REPO" --signer-workflow "$REPO/.github/workflows/full-studio.yml" --source-digest "$SOURCE"
              mv "$setup" assets/
            fi
            mv "$archive" "assets/$filename"
            rm -r "$platform"
          done
          (cd assets && sha256sum * > SHA256SUMS.txt)
          cat > notes.md <<'NOTES'
          On Windows x64, download Meshlit-Studio-Windows-X64-Setup.exe to install Studio for your Windows account. A portable ZIP is also available. On Linux, Intel Mac and Apple Silicon, extract the complete archive.

          The model browser now searches GGUF repositories and filters exact file variants against an estimated CPU memory budget. First launch recommends a pinned starter or a provider based on available memory. Connected LM Studio v1 servers support explicit model instance loading and unloading. A local Flax-enabled environment can run supported MessagePack decoder packages. First launch offers the bundled offline model, a provider connection, or the model library. Settings can reopen the welcome screen. The library includes search and per-model reply settings. General Chat includes reply actions, attachments, internet search, voice input, persistent tool permissions, model loading feedback, and a shared model format catalog with optional local runtime adapters. Compatible models and runtimes must be installed for optional adapters. The bundled Qwen GGUF runs offline.

          Each archive was tested after extraction. Windows Setup was installed, launched and uninstalled in CI. SHA256SUMS.txt covers the five downloads. GitHub build attestations identify the workflow and source commit. This preview has no Windows publisher signature or Apple notarization. Android build 48 APKs are on the earlier v2.0.48-studio.1 release.
          NOTES
          gh release create "$TAG" -R "$REPO" --target "$SOURCE" --prerelease --draft --title "Meshlit Studio v2.0.48-studio.4" --notes-file notes.md assets/*
          gh release edit "$TAG" -R "$REPO" --draft=false
