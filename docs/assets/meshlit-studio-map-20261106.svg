<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="630" viewBox="0 0 1120 630" role="img" aria-labelledby="title desc"><title id="title">Meshlit application and engine map</title><desc id="desc">General chat, separate coding workspaces and bots use model routing with independent permission controls. The HyperL client remains planned.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="1120" height="630" rx="24" fill="#0b1220"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="52" font-size="29" fill="#f8fafc" font-weight="bold">MESHLIT  /  MANY DEVICES. ONE MIND.</text><text x="40" y="84" font-size="18" fill="#94a3b8" font-weight="normal">Android and desktop development · Working features and remaining integration gates</text><rect x="40" y="120" width="320" height="106" rx="16" fill="#60a5fa" fill-opacity="0.13" stroke="#60a5fa" stroke-width="2"/><text x="60" y="152" font-size="22" fill="#60a5fa" font-weight="bold">General chat</text><text x="60" y="180" font-size="17" fill="#e2e8f0" font-weight="normal">Model identity • thinking controls</text><text x="60" y="204" font-size="17" fill="#e2e8f0" font-weight="normal">Passwordless local chat</text><rect x="400" y="120" width="320" height="106" rx="16" fill="#c084fc" fill-opacity="0.13" stroke="#c084fc" stroke-width="2"/><text x="420" y="152" font-size="22" fill="#c084fc" font-weight="bold">Coding workspaces</text><text x="420" y="180" font-size="17" fill="#e2e8f0" font-weight="normal">Separate IDE windows</text><text x="420" y="204" font-size="17" fill="#e2e8f0" font-weight="normal">Review changes • scoped actions</text><rect x="760" y="120" width="320" height="106" rx="16" fill="#2dd4bf" fill-opacity="0.13" stroke="#2dd4bf" stroke-width="2"/><text x="780" y="152" font-size="22" fill="#2dd4bf" font-weight="bold">Bots &amp; management</text><text x="780" y="180" fo