<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Meshlit MoE shard federation">
  <title>Meshlit — Mixture-of-Experts shard federation</title>
  <desc>Animated diagram: a router fans tokens to expert shards on different phones. Each phone holds a subset of the experts; the route is by expert_id, not tensor-parallel.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#1a1140"/>
    </linearGradient>

    <linearGradient id="iridescent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .label {
        font-family: 'Segoe UI', Inter, sans-serif;
        font-size: 14px;
        font-weight: 700;
        fill: #E6E9F2;
      }
      .big {
        font-family: 'Segoe UI', Inter, sans-serif;
        font-size: 22px;
        font-weight: 800;
        fill: #E6E9F2;
      }
      .sub {
        font-family: 'Segoe UI', Inter, sans-serif;
        font-size: 12px;
        fill: #A3AAC2;
      }
      .mono {
        font-family: 'Menlo','Consolas',monospace;
        font-size: 11px;
        fill: #A78BFA;
      }
      .card {
        fill: #121829;
        stroke: rgba(124,92,255,0.35);
        stroke-width: 1.2;
      }
      .expert-on  { fill: #7C5CFF; stroke: #FFFFFF; stroke-width: 1.5; }
      .expert-off { fill: #2B3350; stroke: #6B7392; stroke-width: 0.8; stroke-dasharray: 2 3; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Title -->
  <text class="big" x="640" y="48" text-anchor="middle">MoE shard federation</text>
  <text class="sub" x="640" y="72" text-anchor="middle">Each phone holds a subset of experts. Router dispatches tokens by expert_id, not tensor-parallel.</text>

  <!-- Router card (left) -->
  <rect class="card" x="60" y="180" width="220" height="320" rx="18"/>
  <text class="label" x="80" y="212">Router</text>
  <text class="sub"  x="80" y="232">token-bound dispatch</text>
  <text class="mono"  x="80" y="260">expert_id(e_t)</text>
  <text class="mono"  x="80" y="278">→ phone-by-expert</text>
  <text class="sub"  x="80" y="310">E.g. Mixtral-8x7B</text>
  <text class="mono"  x="80" y="328">8 experts × 7B params</text>
  <text class="mono"  x="80" y="346">≈ 56B total</text>
  <text class="sub"  x="80" y="380">Each phone holds 1-2</text>
  <text class="sub"  x="80" y="396">experts complete.</text>
  <text class="sub"  x="80" y="412">Routes per-token.</text>

  <!-- Animated token stream (3 tokens traveling in sequence to different experts) -->
  <g>
    <circle r="6" fill="#22D3EE">
      <animate attributeName="cx" values="280;480;480;480" keyTimes="0;0.33;0.66;1" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="320;240;240;240" keyTimes="0;0.33;0.66;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="6" fill="#F472B6">
      <animate attributeName="cx" values="280;780;780;780" keyTimes="0;0.5;0.75;1" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="320;420;420;420" keyTimes="0;0.5;0.75;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="6" fill="#FACC15">
      <animate attributeName="cx" values="280;1080;1080;1080" keyTimes="0;0.6;0.85;1" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="320;260;260;260" keyTimes="0;0.6;0.85;1" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Three phones (each holding different experts) -->
  <g>
    <!-- Phone A: experts 1, 2 (top) -->
    <rect class="card" x="380" y="160" width="200" height="160" rx="18"/>
    <text class="label" x="400" y="190">Pixel 7</text>
    <text class="sub"   x="400" y="208">holds experts 1, 2</text>
    <g>
      <circle cx="430" cy="250" r="22" class="expert-on">
        <animate attributeName="r" values="20;26;20" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text class="label" x="430" y="256" text-anchor="middle" font-size="13" fill="#0b1020">E1</text>
      <circle cx="490" cy="250" r="22" class="expert-on">
        <animate attributeName="r" values="20;26;20" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <text class="label" x="490" y="256" text-anchor="middle" font-size="13" fill="#0b1020">E2</text>
      <circle cx="550" cy="250" r="22" class="expert-off"/>
      <text class="mono" x="550" y="256" text-anchor="middle" font-size="13" fill="#6B7392">E3</text>
    </g>
    <text class="mono"  x="400" y="300">2/8 experts</text>
  </g>

  <g>
    <!-- Phone B: experts 3, 4, 5 (middle) -->
    <rect class="card" x="680" y="340" width="200" height="180" rx="18"/>
    <text class="label" x="700" y="370">iPhone 14 Pro</text>
    <text class="sub"   x="700" y="388">holds experts 3, 4, 5</text>
    <g>
      <circle cx="720" cy="440" r="20" class="expert-on">
        <animate attributeName="r" values="18;24;18" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <text class="label" x="720" y="446" text-anchor="middle" font-size="12" fill="#0b1020">E3</text>
      <circle cx="780" cy="440" r="20" class="expert-on">
        <animate attributeName="r" values="18;24;18" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text class="label" x="780" y="446" text-anchor="middle" font-size="12" fill="#0b1020">E4</text>
      <circle cx="840" cy="440" r="20" class="expert-on">
        <animate attributeName="r" values="18;24;18" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <text class="label" x="840" y="446" text-anchor="middle" font-size="12" fill="#0b1020">E5</text>
    </g>
    <text class="mono"  x="700" y="490">3/8 experts</text>
  </g>

  <g>
    <!-- Phone C: experts 6, 7, 8 (top-right) -->
    <rect class="card" x="980" y="180" width="220" height="160" rx="18"/>
    <text class="label" x="1000" y="210">Galaxy S23</text>
    <text class="sub"   x="1000" y="228">holds experts 6, 7, 8</text>
    <g>
      <circle cx="1020" cy="270" r="20" class="expert-on">
        <animate attributeName="r" values="18;24;18" dur="2.0s" repeatCount="indefinite"/>
      </circle>
      <text class="label" x="1020" y="276" text-anchor="middle" font-size="12" fill="#0b1020">E6</text>
      <circle cx="1080" cy="270" r="20" class="expert-on">
        <animate attributeName="r" values="18;24;18" dur="2.7s" repeatCount="indefinite"/>
      </circle>
      <text class="label" x="1080" y="276" text-anchor="middle" font-size="12" fill="#0b1020">E7</text>
      <circle cx="1140" cy="270" r="20" class="expert-on">
        <animate attributeName="r" values="18;24;18" dur="2.3s" repeatCount="indefinite"/>
      </circle>
      <text class="label" x="1140" y="276" text-anchor="middle" font-size="12" fill="#0b1020">E8</text>
    </g>
    <text class="mono"  x="1000" y="320">3/8 experts</text>
  </g>

  <!-- Animated arrows router → phone (dashed, looping) -->
  <g stroke="#A78BFA" stroke-opacity="0.5" stroke-width="1.5" fill="none">
    <line x1="280" y1="320" x2="380" y2="250" stroke-dasharray="6 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="280" y1="320" x2="680" y2="440" stroke-dasharray="6 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.8s" repeatCount="indefinite"/>
    </line>
    <line x1="280" y1="320" x2="980" y2="270" stroke-dasharray="6 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Bottom legend -->
  <g transform="translate(60 580)">
    <text class="sub" x="0" y="0">Legend</text>
    <circle cx="20"  cy="32" r="10" class="expert-on"/>
    <text class="mono" x="40" y="36">held on this phone</text>
    <circle cx="20"  cy="64" r="10" class="expert-off"/>
    <text class="mono" x="40" y="68">held on another phone</text>

    <text class="sub" x="320" y="0">Properties</text>
    <text class="mono" x="320" y="32">• data-parallel, never tensor-parallel</text>
    <text class="mono" x="320" y="52">• token-bound routing by expert_id</text>
    <text class="mono" x="320" y="72">• each node runs a complete slice</text>
    <text class="mono" x="320" y="92">• no layer splitting — network can't keep up</text>
  </g>
</svg>
