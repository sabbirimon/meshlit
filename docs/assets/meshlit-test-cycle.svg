<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 408" role="img" aria-labelledby="title description">
  <title id="title">How to contribute a useful Meshlit hardware test</title>
  <desc id="description">Choose one workflow, run it on named hardware, record the build and measurements, then share a reproducible report so the community can improve and retest.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#121925"/><stop offset="1" stop-color="#183440"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="0"><stop stop-color="#69d8ce"/><stop offset=".5" stop-color="#9bb8f2"/><stop offset="1" stop-color="#f3aa72"/></linearGradient>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#9db6c5" stroke-width="1.6"/></marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .title{fill:#f4f8fa;font-size:34px;font-weight:750}
      .sub{fill:#b7cad4;font-size:17px}
      .card{fill:#20303f;stroke:#496272;stroke-width:1.5}
      .num{fill:#0d1722;font-size:16px;font-weight:800}
      .head{fill:#f5f8fa;font-size:23px;font-weight:700}
      .body{fill:#cedbe2;font-size:16px}
      .line{fill:none;stroke:#9db6c5;stroke-width:2.5;marker-end:url(#arrow)}
      .foot{fill:#b7cad4;font-size:16px}
    </style>
  </defs>
  <rect width="1280" height="408" fill="url(#bg)"/>
  <rect x="42" y="38" width="140" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="42" y="91" class="title">Turn available hardware into useful evidence</text>
  <text x="42" y="122" class="sub">A small, reproducible test is more useful than an unverified capability claim.</text>

  <path d="M320 254H340M626 254H646M932 254H952" class="line"/>
  <g>
    <rect x="42" y="166" width="278" height="177" rx="21" class="card"/>
    <circle cx="76" cy="201" r="17" fill="#6ed9cf"/><text x="76" y="207" text-anchor="middle" class="num">1</text>
    <text x="103" y="208" class="head">Choose</text>
    <text x="66" y="253" class="body">One model or device workflow</text>
    <text x="66" y="282" class="body">One owned phone or host</text>
    <text x="66" y="316" class="body">Build and setup recorded</text>
  </g>
  <g>
    <rect x="348" y="166" width="278" height="177" rx="21" class="card"/>
    <circle cx="382" cy="201" r="17" fill="#87c8ed"/><text x="382" y="207" text-anchor="middle" class="num">2</text>
    <text x="409" y="208" class="head">Run</text>
    <text x="372" y="253" class="body">Follow repeatable steps</text>
    <text x="372" y="282" class="body">Keep grants and Stop visible</text>
    <text x="372" y="316" class="body">Note success or failure</text>
  </g>
  <g>
    <rect x="654" y="166" width="278" height="177" rx="21" class="card"/>
    <circle cx="688" cy="201" r="17" fill="#b3b1ef"/><text x="688" y="207" text-anchor="middle" class="num">3</text>
    <text x="715" y="208" class="head">Measure</text>
    <text x="678" y="253" class="body">Model, time and memory</text>
    <text x="678" y="282" class="body">Power, heat or network</text>
    <text x="678" y="316" class="body">Unknown stays unknown</text>
  </g>
  <g>
    <rect x="960" y="166" width="278" height="177" rx="21" class="card"/>
    <circle cx="994" cy="201" r="17" fill="#f5b27b"/><text x="994" y="207" text-anchor="middle" class="num">4</text>
    <text x="1021" y="208" class="head">Share</text>
    <text x="984" y="253" class="body">Report steps and evidence</text>
    <text x="984" y="282" class="body">Invite a second device test</text>
    <text x="984" y="316" class="body">Improve, then retest</text>
  </g>
  <text x="42" y="383" class="foot">Phones · workstations · labs · accessible setups · different networks — all results welcome</text>
</svg>
