<!doctype html><html><head><meta charset="utf-8"><title>Meshlit real browser P2P integration check</title></head><body><h1>Actual local WebRTC check</h1><p>Two browser peers, no STUN/TURN, no physical phones or native Android command execution. Test key is disposable.</p><button id="run">Run data channel checks</button><pre id="result" role="status">Ready</pre><iframe id="a" title="First peer" src="/index.html" style="height:800px;width:47%"></iframe><iframe id="b" title="Second peer" src="/index.html" style="height:800px;width:47%"></iframe><script>
const results=document.getElementById('result');const wait=async(fn,limit=25000)=>{const start=Date.now();while(Date.now()-start<limit){if(fn())return;await new Promise(r=>setTimeout(r,50));}throw Error('Deadline');};
document.getElementById('run').onclick=async()=>{results.textContent='Running actual WebRTC…';const a=document.getElementById('a').contentWindow,b=document.getElementById('b').contentWindow,logsA=[],logsB=[];a.MeshlitPeer={event:v=>logsA.push(JSON.parse(v))};b.MeshlitPeer={event:v=>logsB.push(JSON.parse(v))};try{const key=[...crypto.getRandomValues(new Uint8Array(32))].map(x=>x.toString(16).padStart(2,'0')).join('');a.document.getElementById('key').value=key;b.document.getElementById('key').value=key;a.document.getElementById('offer').click();await wait(()=>a.document.getElementById('outgoing').value);const offer=a.document.getElementById('outgoing').value;const tampered=JSON.parse(offer);tampered.body=JSON.stringify({...JSON.parse(tampered.body),sdp:'tampered'});b.document.getElementById('incoming').value=JSON.stringify(tampered);let rejected=false;try{await b.apply();}catch(_){rejected=true;}if(!rejected)throw Error('Tampered pairing accepted');b.document.getElementById('incoming').value=offer;await b.apply();await wait(()=>b.document.getElementById('outgoing').value);a.document.getElementById('incoming').value=b.document.getElementById('outgoing').value;await a.apply();await wait(()=>logsA.some(x=>x.type==='route')&&logsB.some(x=>x.type==='route'));if(logsA.find(x=>x.type==='route').value!=='direct'||logsB.find(x=>x.type==='route').value!=='direct')throw Error('Expected actual direct route');const packet=JSON.stringify({v:1,kind:'chat',id:crypto.randomUUID(),time:Date.now(),text:'Hello actual peer 🌍'});a.meshSend(packet);await wait(()=>logsB.some(x=>x.type==='packet'));if(JSON.parse(logsB.find(x=>x.type==='packet').value).text!=='Hello actual peer 🌍')throw Error('Wrong actual data');a.meshSend(packet);await wait(()=>logsB.some(x=>x.type==='rejected'));if(logsB.filter(x=>x.type==='packet').length!==1)throw Error('Replay accepted');a.meshClose();let closed=false;try{a.meshSend(packet);}catch(_){closed=true;}if(!closed)throw Error('Closed channel accepted send');b.meshClose();results.textContent=JSON.stringify({passed:true,checks:['HMAC rejects altered SDP','Actual signed offer/answer','Actual direct ICE route on both peers','Actual Unicode data-channel delivery','Replay rejection','Closed-channel rejection'],scope:'Browser-to-browser on this Mac only; Android WebView and Internet NAT/TURN/phone command qualification pending'},null,2);}catch(e){a.meshClose();b.meshClose();results.textContent='FAILED: '+e.message;}};
</script></body></html>
