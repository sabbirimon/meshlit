# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin code style
kotlin.code.style=official

# Use AndroidX
android.useAndroidX=true

# Disable build features we don't use
android.defaults.buildfeatures.buildconfig=false
android.nonTransitiveRClass=true
# Phase 0.4 — R8 minify+shrink on debug. AGP 9.x requires
# `android.nonFinalResIds=true` for the optimized resource
# shrinking path. The build cost is one extra `R` class field
# (becomes a getter) per resource. Without this, both
# `meshlitV1` and `meshlitV2` debug builds fail at the
# `:app:minify…WithR8` task with
# "Optimized resource shrinking requires non-final IDs".
android.nonFinalResIds=true

# Enable R8 full mode (DEX 040 output). Required by Ktor 3.x which
# uses spaces in some field SimpleNames; pre-DEX-040 dexers reject
# such fields with "Space characters in SimpleName … are not allowed".
android.enableR8.fullMode=true

# Ensure JVM 17 is used for the build (AGP 9 requires it)
org.gradle.java.installations.auto-download=true
